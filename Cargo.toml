[package]
name = "sshctl"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Show, check and safely rewrite ~/.ssh/config, with a TUI (the default), a CLI and a GUI on one core. It proves a rewrite changes nothing by asking ssh -G, instead of guessing from the text."
authors = ["Geert Rymenants"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RyGe87/sshctl"
homepage = "https://github.com/RyGe87/sshctl"
keywords = ["ssh", "ssh-config", "known-hosts", "cli", "gui"]
categories = ["command-line-utilities", "gui", "config"]
exclude = ["/target", "*.png", "/.github", "/docs"]

# Three shells, one core. Each shell sits behind its own feature, so nobody
# has to compile or download a byte more than the shell they want. The
# terminal UI is the default: it is the shell that works everywhere — over
# ssh, in tmux, on machines without a screen — and the cheapest to build.
#   cargo install sshctl                                       -> the TUI
#   cargo install sshctl --features cli                        -> + the CLI
#   cargo install sshctl --no-default-features --features cli  -> only the CLI
#   cargo install sshctl --all-features                        -> all three
[features]
default = ["tui"]
cli = ["dep:clap"]
gui = ["dep:eframe"]
tui = ["dep:ratatui"]

[[bin]]
name = "sshctl"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "sshctl-gui"
path = "src/bin/sshctl-gui.rs"
required-features = ["gui"]

[[bin]]
name = "sshctl-tui"
path = "src/bin/sshctl-tui.rs"
required-features = ["tui"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"], optional = true }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
ratatui = { version = "0.30.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
strip = true
