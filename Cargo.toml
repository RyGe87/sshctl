[package]
name = "sshctl"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Show, check and safely rewrite ~/.ssh/config, with a TUI (the default) and a CLI on one core. It proves a rewrite changes nothing by asking ssh -G, instead of guessing from the text. Zero dependencies."
authors = ["Geert Rymenants"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RyGe87/sshctl"
homepage = "https://github.com/RyGe87/sshctl"
keywords = ["ssh", "ssh-config", "known-hosts", "cli", "tui"]
categories = ["command-line-utilities", "config"]
exclude = ["/target", "*.png", "/.github", "/docs"]

# Two shells, one core. Each shell sits behind its own feature, so nobody
# has to compile or download a byte more than the shell they want. The
# terminal UI is the default: it is the shell that works everywhere — over
# ssh, in tmux, on machines without a screen. Neither shell, nor the core,
# has a single dependency.
#   cargo install sshctl                                       -> the TUI
#   cargo install sshctl --features cli                        -> + the CLI
#   cargo install sshctl --no-default-features --features cli  -> only the CLI
[features]
default = ["tui"]
# The features only switch the binaries on; there is nothing to pull in.
cli = []
tui = []

[[bin]]
name = "sshctl"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "sshctl-tui"
path = "src/bin/sshctl-tui/main.rs"
required-features = ["tui"]

# Size over speed everywhere: this tool waits on ssh, not on itself. The
# combination roughly halves the TUI binary. panic = "abort" drops the
# unwinder; the panic message and the terminal restore still work.
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
