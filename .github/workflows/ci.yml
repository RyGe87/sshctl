name: ci

on:
  push:
    branches: [main]
  pull_request:

# Reading the checkout is all this workflow needs.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      # All features: the default build is the TUI alone, but CI answers for
      # every shell.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The tests lean on the real ssh and ssh-keygen binaries, deliberately:
      # what ssh makes of a config is the yardstick, not what looks right.
      - run: cargo test --all-features
