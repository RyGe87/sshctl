name: ci

on:
  push:
    branches: [main]
  pull_request:

# Reading the checkout is all this workflow needs.
permissions:
  contents: read

# A newer push to the same ref makes the older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # eframe needs the X11/Wayland client headers to build on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --check
      # All features: the default build is the TUI alone, but CI answers for
      # every shell.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The tests lean on the real ssh and ssh-keygen binaries, deliberately:
      # what ssh makes of a config is the yardstick, not what looks right.
      - run: cargo test --all-features

  # Windows gets a compile check: the code is written to build there, but it
  # has not been run in anger yet — see the README.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --all-targets --all-features
