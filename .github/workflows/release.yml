name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: universal binaries and app bundle
        run: |
          mkdir -p dist
          lipo -create -output dist/sshctl \
            target/aarch64-apple-darwin/release/sshctl \
            target/x86_64-apple-darwin/release/sshctl
          lipo -create -output dist/sshctl-gui \
            target/aarch64-apple-darwin/release/sshctl-gui \
            target/x86_64-apple-darwin/release/sshctl-gui
          BIN=dist/sshctl-gui ./bundle-app.sh
          ditto -c -k --keepParent target/sshctl.app sshctl-macos-app.zip
          tar -C dist -czf sshctl-macos-universal.tar.gz sshctl sshctl-gui
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            sshctl-macos-universal.tar.gz
            sshctl-macos-app.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release
      - run: tar -C target/release -czf sshctl-linux-x86_64.tar.gz sshctl sshctl-gui
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: sshctl-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: >
          Compress-Archive
          -Path target/release/sshctl.exe, target/release/sshctl-gui.exe
          -DestinationPath sshctl-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sshctl-windows-x86_64.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
