name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For the build-provenance attestations on the artifacts.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Signing needs the secrets below; without them the ad-hoc signature
      # from bundle-app.sh stands and the build still succeeds.
      HAVE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --all-features --target aarch64-apple-darwin
      - run: cargo build --release --all-features --target x86_64-apple-darwin
      - name: universal binaries and app bundle
        run: |
          mkdir -p dist
          lipo -create -output dist/sshctl \
            target/aarch64-apple-darwin/release/sshctl \
            target/x86_64-apple-darwin/release/sshctl
          lipo -create -output dist/sshctl-gui \
            target/aarch64-apple-darwin/release/sshctl-gui \
            target/x86_64-apple-darwin/release/sshctl-gui
          lipo -create -output dist/sshctl-tui \
            target/aarch64-apple-darwin/release/sshctl-tui \
            target/x86_64-apple-darwin/release/sshctl-tui
          BIN=dist/sshctl-gui ./bundle-app.sh
      - name: sign and notarize
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          # A throwaway keychain holds the Developer ID identity for the
          # length of this job.
          KC=build.keychain
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > cert.p12
          security import cert.p12 -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S 'apple-tool:,apple:,codesign:' -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          IDENT=$(security find-identity -v -p codesigning "$KC" \
            | grep -om1 '"Developer ID Application: [^"]*"' | tr -d '"')
          echo "signing as $IDENT"
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --sign "$IDENT" dist/sshctl dist/sshctl-gui dist/sshctl-tui
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --sign "$IDENT" target/sshctl.app
          # Notarize the app and the bare binaries; staple the app so the
          # approval also holds offline (bare Mach-O files cannot be stapled).
          ditto -c -k --keepParent target/sshctl.app app-submit.zip
          zip -j bins-submit.zip dist/sshctl dist/sshctl-gui dist/sshctl-tui
          xcrun notarytool submit app-submit.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun notarytool submit bins-submit.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple target/sshctl.app
          # Gatekeeper's own verdict gates the release: no pass, no assets.
          spctl -a -vv target/sshctl.app
      - name: package
        run: |
          ditto -c -k --keepParent target/sshctl.app sshctl-macos-app.zip
          tar -C dist -czf sshctl-macos-universal.tar.gz sshctl sshctl-gui sshctl-tui
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            sshctl-macos-universal.tar.gz
            sshctl-macos-app.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --all-features
      - run: tar -C target/release -czf sshctl-linux-x86_64.tar.gz sshctl sshctl-gui sshctl-tui
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: sshctl-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --all-features
      - run: >
          Compress-Archive
          -Path target/release/sshctl.exe, target/release/sshctl-gui.exe, target/release/sshctl-tui.exe
          -DestinationPath sshctl-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: sshctl-windows-x86_64.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz *.zip > SHA256SUMS
      # Linux and Windows have no notary; verifiable provenance is the
      # honest equivalent. `gh attestation verify <file> --owner RyGe87`
      # proves an artifact was built from this repository by this workflow.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.tar.gz
            *.zip
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # A tag with a dash (v0.2.0-rc.1) is a trial run, not a release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS
